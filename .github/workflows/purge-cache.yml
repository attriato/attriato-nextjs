name: Purge Cloudflare Cache on Vercel Deploy

on:
  push:
    branches:
      - main

jobs:
  purge-cloudflare:
    runs-on: ubuntu-latest
    steps:
      # 1. Wait for Vercel's official GitHub integration to complete the deployment
      - name: Wait for Vercel Deployment
        uses: vercel/wait-for-deployment-action@v2
        id: vercel_deploy
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Tell Cloudflare to clear its edge cache once Vercel is live
      - name: Purge Cloudflare Cache
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
